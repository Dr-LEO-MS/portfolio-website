      <text x="964" y="434" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">70%</text>
    </g>
    <text x="478" y="576" font-family="Consolas, Menlo, monospace" font-size="16" fill="#9aa3b2">weekly performance &#183; live data</text>
