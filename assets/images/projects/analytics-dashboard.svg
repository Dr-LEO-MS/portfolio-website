<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="c7title c7desc">
  <title id="c7title">Creative Analytics Dashboard - project cover</title>
  <desc id="c7desc">Dark technical card showing dashboard metric cards, a bar chart and a progress ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191734"/><stop offset="1" stop-color="#0e0d19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e91e63" stop-opacity="0.22"/><stop offset="1" stop-color="#e91e63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2196f3"/><stop offset="1" stop-color="#e91e63"/>
