      <text x="498" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">24,318</text>
      <rect x="672" y="152" width="170" height="86" rx="14" fill="#1b1930"/>
      <text x="692" y="192" font-family="Consolas, Menlo, monospace" font-size="16" fill="#9aa3b2">REVENUE</text>
      <text x="692" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4caf50">+18.4%</text>
      <rect x="866" y="152" width="136" height="86" rx="14" fill="#1b1930"/>
      <text x="886" y="192" font-family="Consolas, Menlo, monospace" font-size="16" fill="#9aa3b2">SESSIONS</text>
      <text x="886" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">3:42</text>
    </g>

    <g fill="url(#barA)">
      <rect x="486" y="424" width="36" height="104" rx="18"/>
      <rect x="542" y="384" width="36" height="144" rx="18"/>
      <rect x="598" y="446" width="36" height="82" rx="18"/>
      <rect x="654" y="350" width="36" height="178" rx="18"/>
      <rect x="710" y="404" width="36" height="124" rx="18"/>
    </g>
