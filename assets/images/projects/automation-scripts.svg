<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="c8title c8desc">
  <title id="c8title">Automation Scripts - project cover</title>
  <desc id="c8desc">Dark technical card showing a terminal window running a Python automation script with a gear and data flow icons.</desc>
  <defs>
