<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="c1title c1desc">
  <title id="c1title">Open Fingers Counter - project cover</title>
  <desc id="c1desc">Dark technical card showing a hand with tracked landmark points, a webcam detection frame and a finger-count badge.</desc>
  <defs>
