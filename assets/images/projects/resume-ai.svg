    <rect x="634" y="174" width="140" height="12" rx="6" fill="#9aa3b2"/>
    <rect x="536" y="230" width="348" height="10" rx="5" fill="#c7ccd8"/>
    <rect x="536" y="258" width="300" height="10" rx="5" fill="#c7ccd8"/>
    <rect x="536" y="286" width="330" height="10" rx="5" fill="#c7ccd8"/>
    <rect x="536" y="328" width="120" height="26" rx="13" fill="#2196f3"/>
    <rect x="666" y="328" width="96" height="26" rx="13" fill="#e91e63" fill-opacity="0.85"/>
    <rect x="536" y="376" width="348" height="10" rx="5" fill="#c7ccd8"/>
    <rect x="536" y="404" width="262" height="10" rx="5" fill="#c7ccd8"/>
    <rect x="536" y="432" width="318" height="10" rx="5" fill="#c7ccd8"/>
    <rect x="536" y="460" width="210" height="10" rx="5" fill="#c7ccd8"/>
